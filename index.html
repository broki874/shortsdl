<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Shorts downloader — preview</title>

<style>

  body{font-family:system-ui,sans-serif;max-width:600px;margin:8vh auto;padding:0 20px;color:#111}

  h1{font-size:22px;margin:0 0 4px}

  p.sub{color:#666;margin:0 0 24px;font-size:14px}

  .row{display:flex;gap:8px;margin-bottom:12px}

  input{flex:1;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:15px}

  button{padding:12px 18px;border-radius:8px;border:1px solid #111;font-size:15px;background:#111;color:#fff;font-weight:600;cursor:pointer}

  button:disabled{opacity:.5;cursor:not-allowed}

  #status{margin-top:14px;font-size:14px;color:#333;min-height:20px}

  #status.err{color:#b00020}

  #preview{display:none}

  #preview.show{display:block}

  #paste.hide{display:none}

  video{width:100%;max-height:60vh;border-radius:10px;background:#000;margin-bottom:16px}

  .title{font-size:16px;font-weight:600;margin-bottom:16px}

  .dl{display:inline-block;padding:12px 22px;background:#111;color:#fff;border-radius:8px;

      text-decoration:none;font-weight:600;font-size:15px;margin-right:8px}

  .dl.alt{background:#fff;color:#111;border:1px solid #111}

  .back{background:none;border:none;color:#666;cursor:pointer;font-size:14px;padding:0;margin-top:18px;display:block}

</style>

</head>

<body>

  <div id="paste">

    <h1>Shorts downloader</h1>

    <p class="sub">Paste a YouTube Shorts link to preview and download it.</p>

    <div class="row">

      <input id="url" type="url" placeholder="https://www.youtube.com/shorts/…" autocomplete="off">

      <button id="go">Continue</button>

    </div>

    <div id="status"></div>

  </div>

  <div id="preview">

    <video id="vid" controls playsinline></video>

    <div class="title" id="title"></div>

    <div id="links"></div>

    <button class="back" id="back">&larr; download another</button>

  </div>

<script>

const $ = id => document.getElementById(id);

const say = (m, err) => { $("status").textContent = m; $("status").className = err ? "err" : ""; };

function showPreview(d){

  $("vid").src = d.best ? d.best.url : "";

  $("title").textContent = d.title || "video";

  const safe = (d.title || "video").replace(/[^\w.\- ]+/g, "_").slice(0, 60);

  const links = [];

  if(d.best) links.push('<a class="dl" href="' + d.best.url + '&title=' + encodeURIComponent(safe) + '" download="' + safe + '.mp4" target="_blank" rel="noopener">Download video</a>');

  if(d.audio) links.push('<a class="dl alt" href="' + d.audio.url + '&title=' + encodeURIComponent(safe) + '" download="' + safe + '.m4a" target="_blank" rel="noopener">Audio only</a>');

  $("links").innerHTML = links.join("");

  $("paste").classList.add("hide");

  $("preview").classList.add("show");

}

function reset(){

  $("preview").classList.remove("show");

  $("paste").classList.remove("hide");

  $("vid").pause(); $("vid").src = "";

  $("url").value = ""; say("");

}

$("go").addEventListener("click", async () => {

  const url = $("url").value.trim();

  if(!url){ say("Paste a link first.", true); return; }

  $("go").disabled = true; say("Loading preview…");

  try{

    const r = await fetch("/api/proxy?url=" + encodeURIComponent(url));

    const j = await r.json();

    if(!j.ok) throw new Error(j.error?.message || ("Failed (" + r.status + ")"));

    showPreview(j.data);

  }catch(e){ say(e.message, true); }

  finally{ $("go").disabled = false; }

});

$("back").addEventListener("click", reset);

$("url").addEventListener("keydown", e => { if(e.key === "Enter") $("go").click(); });

</script>

</body>

</html>
