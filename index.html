<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts API test (RapidAPI)</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:0 20px;color:#111}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{color:#666;margin:0 0 24px;font-size:14px}
  .row{display:flex;gap:8px;margin-bottom:12px}
  input{flex:1;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:15px}
  button{padding:12px 16px;border-radius:8px;border:1px solid #111;font-size:15px;background:#111;color:#fff;font-weight:600;cursor:pointer;width:100%}
  button:disabled{opacity:.5;cursor:not-allowed}
  #status{margin-top:16px;font-size:14px;color:#333;min-height:20px}
  #status.err{color:#b00020}
  #out{margin-top:18px;display:none}
  #out.show{display:block}
  #out img{width:120px;border-radius:8px;float:left;margin:0 14px 10px 0}
  #out h2{font-size:16px;margin:0 0 12px}
  .dl{display:inline-block;margin:4px 8px 4px 0;padding:10px 16px;background:#111;color:#fff;
      border-radius:8px;text-decoration:none;font-size:14px;font-weight:600}
  .dl.alt{background:#fff;color:#111;border:1px solid #111}
  code{background:#f1f1f1;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
  <h1>Shorts API test <span style="font-weight:400;color:#888;font-size:14px">· RapidAPI</span></h1>
  <p class="sub">Paste a <code>youtube.com/shorts/…</code> link.</p>

  <div class="row">
    <input id="url" type="url" placeholder="https://www.youtube.com/shorts/…" autocomplete="off">
  </div>
  <div class="row"><button id="go">Get download links</button></div>
  <div id="status"></div>

  <div id="out">
    <img id="thumb" alt="">
    <h2 id="title"></h2>
    <div id="links"></div>
  </div>

<script>
const $ = id => document.getElementById(id);
const say = (m, err) => { $("status").textContent = m; $("status").className = err ? "err" : ""; };

$("go").addEventListener("click", async () => {
  const url = $("url").value.trim();
  if(!url){ say("Paste a link first.", true); return; }
  $("go").disabled = true;
  $("out").classList.remove("show");
  say("Fetching…");
  try{
    const r = await fetch("/api/proxy?url=" + encodeURIComponent(url));
    const j = await r.json();
    if(!j.ok) throw new Error(j.error?.message || ("Failed (" + r.status + ")"));
    const d = j.data;

    $("thumb").src = d.thumbnail || "";
    $("title").textContent = d.title || "video";

    const safe = (d.title || "video").replace(/[^\w.\- ]+/g, "_").slice(0, 60);

    const links = [];
    if(d.best) links.push('<a class="dl" data-url="' + encodeURIComponent(d.best.url) + '" data-name="' + safe + '.mp4" href="#">Download video' + (d.best.quality ? " (" + d.best.quality + ")" : "") + '</a>');
    if(d.audio) links.push('<a class="dl alt" data-url="' + encodeURIComponent(d.audio.url) + '" data-name="' + safe + '.m4a" href="#">Audio only</a>');
    $("links").innerHTML = links.join("") || "No links found.";

    // Fetch the file in the browser (from the user's own IP, so Google's
    // IP-locked link is happy), then save it via a blob. This is what forces a
    // download instead of playing in a tab, without a server in the middle.
    document.querySelectorAll(".dl").forEach(a => {
      a.addEventListener("click", async ev => {
        ev.preventDefault();
        const url = decodeURIComponent(a.dataset.url);
        const name = a.dataset.name;
        const original = a.textContent;
        a.textContent = "Downloading…";
        a.style.pointerEvents = "none";
        try{
          const r = await fetch(url);
          if(!r.ok) throw new Error("HTTP " + r.status);
          const blob = await r.blob();
          const href = URL.createObjectURL(blob);
          const tmp = document.createElement("a");
          tmp.href = href; tmp.download = name;
          document.body.appendChild(tmp); tmp.click(); tmp.remove();
          URL.revokeObjectURL(href);
          a.textContent = "Saved ✓";
        }catch(e){
          a.textContent = original;
          say("Download failed: " + e.message + " (link may have expired — fetch links again).", true);
        }finally{
          a.style.pointerEvents = "";
        }
      });
    });

    $("out").classList.add("show");
    say("Ready. Click to download — it saves straight to your device.");
  }catch(e){ say(e.message, true); }
  finally{ $("go").disabled = false; }
});
</script>
</body>
</html>
