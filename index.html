<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts API test</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:0 20px;color:#111}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{color:#666;margin:0 0 24px;font-size:14px}
  .row{display:flex;gap:8px;margin-bottom:12px}
  input{flex:1;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:15px}
  select,button{padding:12px 16px;border-radius:8px;border:1px solid #bbb;font-size:15px;background:#fff;cursor:pointer}
  button{background:#111;color:#fff;border-color:#111;font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  #status{margin-top:16px;font-size:14px;color:#333;white-space:pre-wrap;min-height:20px}
  #status.err{color:#b00020}
  code{background:#f1f1f1;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
  <h1>Shorts API test</h1>
  <p class="sub">Paste a <code>youtube.com/shorts/…</code> link and download it through your API.</p>

  <div class="row">
    <input id="url" type="url" placeholder="https://www.youtube.com/shorts/…" autocomplete="off">
    <select id="fmt">
      <option value="video">Video</option>
      <option value="audio">Audio</option>
    </select>
  </div>
  <div class="row">
    <button id="go" style="flex:1">Download</button>
  </div>
  <div id="status"></div>

<script>
const $ = id => document.getElementById(id);
const P = "/api/proxy?p=";
const say = (m, err) => { $("status").textContent = m; $("status").className = err ? "err" : ""; };

async function call(path, body){
  const r = await fetch(P + encodeURIComponent(path), body ? {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
  } : undefined);
  const j = await r.json().catch(() => ({}));
  if(!j.ok) throw new Error(j.error?.message || ("Request failed (" + r.status + ")"));
  return j.data;
}

$("go").addEventListener("click", async () => {
  const url = $("url").value.trim();
  if(!url){ say("Paste a link first.", true); return; }
  $("go").disabled = true;
  try{
    say("Queuing…");
    const job = await call("/v1/download", { url, format: $("fmt").value });
    const id = job.id;

    for(;;){
      const s = await call("/v1/jobs/" + id);
      if(s.state === "done"){
        say("Done. Downloading file…");
        window.location = P + encodeURIComponent("/v1/jobs/" + id + "/file");
        break;
      }
      if(s.state === "error") throw new Error(s.error || "Download failed.");
      say((s.phase || s.state) + " · " + Math.round(s.percent || 0) + "%"
          + (s.speed ? " · " + s.speed : ""));
      await new Promise(r => setTimeout(r, 1000));
    }
  }catch(e){ say(e.message, true); }
  finally{ $("go").disabled = false; }
});
</script>
</body>
</html>
